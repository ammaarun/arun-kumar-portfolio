version: '3.8'

services:
  portfolio-cms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio_cms_app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    volumes:
      # Mount persistent database file so admin edits persist across container restarts
      - ./server/data:/app/server/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
